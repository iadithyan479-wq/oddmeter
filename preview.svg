<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500"><rect width="1100" height="500" rx="24" fill="#101711"/><text x="58" y="70" fill="#c5f36b" font-family="Arial" font-size="14" font-weight="bold" letter-spacing="3">LOCAL-FIRST ANOMALY DETECTION</text><text x="58" y="130" fill="#edf4e7" font-family="Arial" font-size="48" font-weight="bold">Find the odd rows.</text><text x="58" y="165" fill="#98aa99" font-family="Arial" font-size="17">A tiny Python ML tool for curious data.</text><rect x="58" y="200" width="984" height="235" rx="16" fill="#171f19" stroke="#304035"/><text x="86" y="239" fill="#70dbc0" font-family="monospace" font-size="14">$ oddmeter analyze metrics.csv --contamination 0.03</text><text x="86" y="280" fill="#edf4e7" font-family="monospace" font-size="14">Analyzed 600 rows using 4 feature(s): cpu, memory, requests, errors</text><text x="86" y="311" fill="#c5f36b" font-family="monospace" font-size="14">Flagged 30 rows (5.0%); report: ./oddmeter-report.csv</text><line x1="86" y1="336" x2="1012" y2="336" stroke="#304035"/><text x="86" y="370" fill="#98aa99" font-family="monospace" font-size="13">row 218   score -0.2412   strongest signal: error_pct</text><text x="86" y="400" fill="#98aa99" font-family="monospace" font-size="13">row 503   score -0.2238   strongest signal: requests_per_min</text><rect x="832" y="68" width="210" height="36" rx="18" fill="#213126" stroke="#425b43"/><text x="937" y="91" fill="#c5f36b" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold">PYTHON · SCIKIT-LEARN</text></svg>

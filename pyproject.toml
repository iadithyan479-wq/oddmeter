[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oddmeter"
version = "0.1.0"
description = "A small, explainable-ish CLI for finding unusual rows in tabular data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Adithyan" }]
dependencies = ["numpy>=1.24", "scikit-learn>=1.3"]
keywords = ["anomaly-detection", "machine-learning", "isolation-forest", "csv", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
oddmeter = "oddmeter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
